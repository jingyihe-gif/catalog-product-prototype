<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>coScene Catalog 产品方案原型</title><style>body{margin:0}</style></head><body><meta charset="utf-8">

<style>
#catalog-prototype{--bg:light-dark(#fff,#151821);--ink:light-dark(#101525,#edf0f7);--sub:light-dark(#667085,#adb7cc);--soft:light-dark(#f4f5f8,#242938);--line:light-dark(#e4e6eb,#3a4153);--blue:light-dark(#2864ff,#8baeff);--accent:light-dark(#edf3ff,#253958);--button:light-dark(#101525,#e6ebf6);--buttonText:light-dark(#fff,#151821);--green:light-dark(#20603b,#a2d9b8);font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);min-height:850px;padding:0 0 30px;color-scheme:light dark}#catalog-prototype *{box-sizing:border-box}#catalog-prototype button,#catalog-prototype input,#catalog-prototype select,#catalog-prototype textarea{font:inherit;color:inherit}#catalog-prototype button{border:1px solid var(--line);background:var(--bg);padding:8px 15px;border-radius:24px;cursor:pointer}#catalog-prototype button:hover{background:var(--soft)}#catalog-prototype button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}#catalog-prototype .main-button{background:var(--button);color:var(--buttonText);border-color:var(--button)}#catalog-prototype .main-button:hover{opacity:.86}#catalog-prototype .topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 22px;background:var(--soft);font-size:12px;color:var(--sub)}#catalog-prototype select{border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:6px 10px}#catalog-prototype nav{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;margin:26px auto 34px;border:1px solid var(--line);border-radius:48px;width:max-content;max-width:calc(100% - 24px);flex-wrap:wrap;box-shadow:0 8px 22px #00000006}#catalog-prototype nav button{border-color:transparent;color:var(--sub)}#catalog-prototype nav button.active{color:var(--ink);border-color:var(--line);box-shadow:0 3px 7px #00000008}#catalog-prototype .logo{font-size:23px;letter-spacing:-.8px;color:var(--blue);font-weight:650;padding:0 13px}#catalog-prototype .new{display:inline-block;font-size:11px;color:var(--blue);background:var(--accent);padding:1px 7px;border-radius:5px;margin-left:7px;vertical-align:middle}#catalog-prototype .workspace{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;padding:0 26px}#catalog-prototype aside{border:1px solid var(--line);border-radius:24px;padding:22px;height:fit-content;min-width:0}#catalog-prototype aside button{display:block;border:0;width:100%;text-align:left;border-radius:12px;padding:12px;margin:6px 0}#catalog-prototype aside button.active{background:var(--soft)}#catalog-prototype h1{font-size:30px;line-height:1.3;font-weight:600;margin:0}#catalog-prototype h2{font-size:21px;font-weight:550;margin:0 0 18px}#catalog-prototype h3{font-size:16px;font-weight:550;margin:0 0 12px}#catalog-prototype p{margin:8px 0}#catalog-prototype .muted{color:var(--sub);font-size:13px}#catalog-prototype .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#catalog-prototype .between{justify-content:space-between}#catalog-prototype .summary{margin:20px 0;padding:12px 16px;background:var(--accent);border-radius:12px;color:var(--ink)}#catalog-prototype .task{display:grid;grid-template-columns:105px minmax(0,1fr);gap:20px;padding:22px 12px;border-radius:18px;margin:10px 0}#catalog-prototype .task:hover{background:var(--soft)}#catalog-prototype .task img{width:105px;height:65px;object-fit:cover;border-radius:12px}#catalog-prototype .task-name{font-size:18px;margin-bottom:4px}#catalog-prototype .tag{padding:4px 10px;background:var(--soft);border-radius:18px;font-size:12px;color:var(--sub)}#catalog-prototype .task .row{margin-top:12px}#catalog-prototype .link{border:0;color:var(--blue);background:transparent;padding:3px 0}#catalog-prototype .section{border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:20px;min-width:0}#catalog-prototype .note{padding:12px 15px;background:var(--soft);border-radius:10px;color:var(--sub);font-size:13px;margin:16px 0}#catalog-prototype .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}#catalog-prototype label{display:block}#catalog-prototype label>span{display:block;margin-bottom:7px;font-size:13px;color:var(--sub)}#catalog-prototype input:not([type=checkbox]),#catalog-prototype textarea,#catalog-prototype .fields select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}#catalog-prototype input[type=checkbox]{accent-color:var(--blue);width:17px;height:17px;vertical-align:middle}#catalog-prototype table{width:100%;border-collapse:collapse;font-size:14px}#catalog-prototype th,#catalog-prototype td{text-align:left;padding:15px 9px;border-bottom:1px solid var(--line);font-weight:400}#catalog-prototype th{color:var(--sub);font-size:12px}#catalog-prototype .table-wrap{overflow-x:auto}#catalog-prototype .crumb{font-size:13px;color:var(--sub);margin-bottom:18px}#catalog-prototype .admin-brand{color:var(--green)}#catalog-prototype .empty{padding:50px 15px;text-align:center;color:var(--sub)}#catalog-prototype .overlay{position:fixed;inset:0;background:#00000030;z-index:90;display:flex;justify-content:flex-end}#catalog-prototype .sheet{background:var(--bg);width:530px;max-width:100%;height:100%;overflow-y:auto;padding:26px;box-shadow:-15px 0 40px #00000012}#catalog-prototype .sheet label{margin:18px 0}#catalog-prototype .sample-row{display:grid;grid-template-columns:24px 76px minmax(0,1fr);gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}#catalog-prototype .sample-row img{width:76px;height:52px;border-radius:9px;object-fit:cover}#catalog-prototype .status{color:var(--green)}#catalog-prototype [hidden]{display:none!important}#catalog-prototype .footer{margin:30px 26px 0;border-top:1px solid var(--line);padding-top:15px;color:var(--sub);font-size:12px}#catalog-prototype .flow{padding:16px 0;border-bottom:1px solid var(--line)}@media(max-width:760px){#catalog-prototype .workspace{grid-template-columns:1fr;padding:0 15px;gap:18px}# 合格的数据不作为新增样例发布。</div></div>';}else{const drafts=coverDraft.map((x,i)=>x===null?'':'<tr><td>任务封面</td><td>'+tasks[i].zh+'</td><td>'+tasks[i].samples[coverSource[i]].name+' → '+tasks[i].samples[x].name+'</td><td><button data-cover-preview="'+i+'">预览并发布</button></td></tr>').join('');body='<h1>待发布更新</h1><p class="muted">这里只放实际待确认的变化，不作为日常维护入口。</p><div class="section" style="margin-top:24px"><div class="table-wrap"><table><thead><tr><th>类型</th><th>任务</th><th>变化</th><th>操作</th></tr></thead><tbody>'+drafts+'</tbody></table></div>'+(!drafts?'<p class="empty">暂无待发布更新。需要修改已有任务时，请进入「任务与封面」。</p>':'')+'</div><div class="note">样例、参数、指标或封面产生变化后，在此检查并确认发布；不会把所有维护操作都列成待发布事项。</div>';}workspace('<h2 class="admin-brand">Catalog Admin</h2><p class="muted">申请审批〔保留〕</p><p class="muted">用户管理〔保留〕</p><h3 style="margin-top:24px">内容维护〔仅管理员〕</h3>'+menu.map(([key,label])=>'<button data-maint="'+key+'" class="'+(maintenanceTab===key?'active':'')+'">'+label+'</button>').join(''),body);}function chooseCover(i){if(role!=='admin')return;openSheet('选择任务封面来源','<p>'+tasks[i].zh+'</p><p class="muted">从该任务关联的样例记录中选一条。图片来自 coScene，不影响精选和交付选择。</p>'+tasks[i].samples.map((sample,j)=>'<label class="sample-row"><input type="radio" name="cover-source" value="'+j+'" '+((coverDraft[i]??coverSource[i])===j?'checked':'')+'><img src="'+tasks[i].img+'" alt="来源缩略图示例"><span>'+sample.name+'<br><span class="muted">coScene 记录缩略图〔原型候选图为示例〕</span></span></label>').join('')+'<button id="save-cover" class="main-button">保存来源，预览后发布</button>');$('#save-cover').onclick=()=>{coverDraft[i]=Number(sheet.querySelector('[name="cover-source"]:checked').value);maintenanceTab='pending';show('maintenance');};}function previewCover(i){openSheet('确认任务封面更新','<p>'+tasks[i].zh+'</p><img src="'+tasks[i].img+'" alt="待发布封面示例" style="width:100%;border-radius:12px"><p>新来源：'+tasks[i].samples[coverDraft[i]].name+'</p><button id="publish-cover" class="main-button">确认发布〔模拟〕</button><p class="muted">来源图片变化同样需要预览确认；来源失效时保留当前封面并提示。</p>');$('#publish-cover').onclick=()=>{coverSource[i]=coverDraft[i];coverDraft[i]=null;coverPublished[i]=true;maintenanceTab='tasks';show('maintenance');};}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.maint){if(role==='admin'){maintenanceTab=b.dataset.maint;show('maintenance');}return;}if(b.dataset.cover!==undefined){chooseCover(Number(b.dataset.cover));return;}if(b.dataset.coverPreview!==undefined){previewCover(Number(b.dataset.coverPreview));return;}if(b.dataset.coverSync!==undefined){const i=Number(b.dataset.coverSync);coverDraft[i]=coverSource[i];maintenanceTab='pending';show('maintenance');return;}if(b.dataset.go){show(b.dataset.go);return;}if(b.dataset.adjust!==undefined){adjust(Number(b.dataset.adjust));return;}if(b.dataset.task!==undefined){taskIndex=Number(b.dataset.task);show('task');return;}if(b.dataset.customer){customer=b.dataset.customer;show('customers');return;}if(b.dataset.delivery){activeDelivery=Number(b.dataset.delivery);show('detail');return;}if(b.id==='download-button')download();if(b.id==='request-button'){openSheet('原有评估申请流程','<p>客户登录、填写需求、提交申请、后台审批，沿用现有流程。</p>');}if(b.id==='task-select')adjust(taskIndex);if(b.id==='create-customer')newCustomer(false);if(b.id==='copy-link')$('#detail-feedback').textContent='演示：这里复制本次交付的唯一下载链接，未操作真实剪贴板。';if(b.id==='revoke-link'){deliveries.find(d=>d.id===activeDelivery).status='已撤销';renderDetail();$('#detail-feedback').textContent='演示撤销：停止该链接后续下载，交付记录保留。';}if(b.id==='publish')$('#publish-feedback').textContent='已模拟确认发布。未更新真实目录数据。';});$('#close-sheet').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close();});root.addEventListener('keydown',e=>{if(e.key==='Escape')close();});$('#identity').onchange=e=>{role=e.target.value;show(page);};show('lists');})();
